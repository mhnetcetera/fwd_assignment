<html lang="en">
<head>

<script>
    alert("Mari kita belajar berhitung");//Menampilkan pop up "Mari kita belajar berhitung"
</script>
<body>

    <script>
    //Data Persegi Panjang
    var panjangPP = 20; //Mendefinisikan Variabel Nilai Panjang Persegi Panjang 
    var lebarPP = 15.25; //Mendefinisikan Variabel Nilai Lebar Persegi Panjang
    let luasPP = panjangPP * lebarPP; //Melakukan perhtiungan luas dengan operator

    //Data Bujur Sangkar
    var sisiBS = 32; //Mendefinisikan Variabel Nilai Sisi Bujur Sangkar
    let luasBS = sisiBS *  sisiBS; //Rumus Luas Bujur Sangkar: Melakukan perhtiungan luas dengan operator

    
    //Data Segitiga
    const pembagiSG = 0.5; //Mendefinisikan Variabel Nilai Pembagi dalam Luas Segitiga dengan konstanta (nilai tidak berubah)
    var alasSG = 42; //Mendefinisikan Variabel Nilai Alas Segitiga
    var tinggiSG = 12;//Mendefinisikan Variabel Nilai Tinggi Segitiga
    let luasSG = pembagiSG * alasSG * tinggiSG //Rumus Luas Segitiga:Melakukan perhtiungan luas dengan operator



    //Mencetak output pada halaman browser
    document.write(
        "Berikut adalah data persegi panjang yang akan dihitung luasnya:" +
        "<br>Nilai Panjang Persegi Panjang: " + panjangPP + " cm" +
        "<br>Nilai Lebar Persegi Panjang: " + lebarPP + " cm" +
        "<br>Setelah dihitung, luas persegi panjang tersebut sebesar " + luasPP + " cm2"
    );

    //Membagi halaman
    document.write("<hr>");

    //Mencetak output pada halaman browser
    document.write(
        "Berikut adalah data bujur sangkar yang akan dihitung luasnya:" +
        "<br>Nilai Sisi Bujur Sangkar: " + sisiBS + " cm" +
        "<br>Setelah dihitung, luas bujur sangkar tersebut sebesar " + luasBS + " cm2"
    );

    //Membagi halaman
    document.write("<hr>");

    //Mencetak output pada halaman browser
    document.write(
        "Berikut adalah data segitiga yang akan dihitung luasnya:" +
        "<br>Nilai Alas Segitiga: " + alasSG + " cm" +
        "<br>Nilai Tinggi Segitiga: " + tinggiSG + " cm" +
        "<br>Setelah dihitung, luas persegi panjang tersebut sebesar " + luasSG + " cm2"
    );

    </script>
    
</body>
</html>
