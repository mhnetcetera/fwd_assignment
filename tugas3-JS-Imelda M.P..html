<body>

    <p>Untuk melihat jawaban tugas: Klik kanan (inspect)</p>
    <script>

let produkToko = [
  {id: 1, nama: "Laptop", harga: 7000000, stok: 5},
  {id: 2, nama: "Mouse", harga: 200000, stok: 10},
  {id: 3, nama: "Keyboard", harga: 350000, stok: 7}
];

function addProduct(nama, harga, stok) {
  const new_id = produkToko.length > 0 ? produkToko[produkToko.length - 1].id + 1 : 1;
  const newProduct = {
    id: new_id,
    nama: nama,
    harga: harga,
    stok: stok
  };
  produkToko.push(newProduct);
  console.log(`Produk "${nama}" berhasil ditambahkan pada daftar produk toko`);
}

function deleteProduct(id) {
  const index = produkToko.findIndex(produk => produk.id === id);

  if (index !== -1) {
    const produk_dihapus = produkToko.splice(index, 1);
    console.log(`Produk "${produk_dihapus[0].nama}" (ID: ${id}) berhasil dihapus dari daftar produk`);
  } else {
    console.log(`Produk dengan id ${id} tidak ditemukan.`);
  }
}

function showProduct() {
  console.log("\nDaftar Produk terupdate:");
  if (produkToko.length === 0) {
    console.log("Pada saat ini, tidak ada produk yang dapat ditampilkan.");
  } else {
    produkToko.forEach(produk => {
      console.log(`id: ${produk.id}, Nama: ${produk.nama}, Harga: Rp${produk.harga}, Stok: ${produk.stok}`);
    });
  }
}



console.log("Daftar produk (awal): ");
console.log(produkToko);


console.log("\nSetelah ditambahkan produk Monitor:");
addProduct("Monitor", 3500000, 4);


console.log("\nDaftar produk setelah diupdate: ");
showProduct();


console.log("\nMenghapus salah satu produk dari daftar produk: ");
deleteProduct(2);

console.log("\nDaftar produk setelah diupdate: ");
showProduct();
    </script>
</body>
</html>
